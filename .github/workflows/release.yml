name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]
  workflow_dispatch:

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair versao
        id: ver
        run: |
          VER=$(grep -oP 'version="\K[^"]+' app/main.py | head -1)
          [ -z "$VER" ] && echo "Versao nao encontrada" && exit 1
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Verificar se tag ja existe
        id: check
        run: |
          git fetch --tags
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "new=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.ver.outputs.version }} ja existe — sem release."
          else
            echo "new=true" >> $GITHUB_OUTPUT
            echo "Nova versao: v${{ steps.ver.outputs.version }}"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.new == 'true'

      - name: Login no GHCR
        if: steps.check.outputs.new == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push Docker
        if: steps.check.outputs.new == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extrair notas do CHANGELOG
        id: notas
        if: steps.check.outputs.new == 'true'
        run: |
          # Recorta a seção da versão: da linha "## vX.Y.Z" até o próximo "## v".
          # generate_release_notes monta a lista a partir de pull requests, e
          # como os commits vão direto no master a release saía só com o link de
          # comparação — o que mudou ficava só no CHANGELOG do repositório.
          awk -v ver="## v${{ steps.ver.outputs.version }}"             '$0 == ver {f=1; next} f && /^## v/ {exit} f {print}'             CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ] && grep -q '[^[:space:]]' release-notes.md; then
            echo "tem=true" >> $GITHUB_OUTPUT
          else
            echo "tem=false" >> $GITHUB_OUTPUT
            echo "Sem seção para v${{ steps.ver.outputs.version }} no CHANGELOG.md — usando só as notas automáticas."
          fi

      - name: Criar GitHub Release
        if: steps.check.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body_path: ${{ steps.notas.outputs.tem == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: true
