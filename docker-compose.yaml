services:
  cpf-validador:
    build: .
    ports:
      - "8002:8000"
    environment:
      - API_TOKEN=${API_TOKEN:-}
      - ENV=${ENV:-production}
      - SOURCE=${SOURCE:-trt3}
      - TCU_BASE_URL=${TCU_BASE_URL:-https://certidoes.apps.tcu.gov.br}
      - TCU_POW_MAX_COUNTER=${TCU_POW_MAX_COUNTER:-200000}
      - TCU_MAX_ATTEMPTS=${TCU_MAX_ATTEMPTS:-3}
      - TRT3_BASE_URL=${TRT3_BASE_URL:-https://certidao.trt3.jus.br}
      - TRT3_FORM_PATH=${TRT3_FORM_PATH:-/certidao/feitosTrabalhistas/aba1.emissao.htm}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT:-30}
      - CAPTCHA_TIMEOUT=${CAPTCHA_TIMEOUT:-15}
      - MAX_CAPTCHA_ATTEMPTS=${MAX_CAPTCHA_ATTEMPTS:-20}
      - RETRY_DELAY=${RETRY_DELAY:-1.0}
      - DEFAULT_WORKERS=${DEFAULT_WORKERS:-8}
      - MAX_WORKERS=${MAX_WORKERS:-20}
      - TASK_TIMEOUT=${TASK_TIMEOUT:-60}
      - MAX_WILDCARDS_IN_MASK=${MAX_WILDCARDS_IN_MASK:-5}
      - RATE_LIMIT_CPF=${RATE_LIMIT_CPF:-10/minute}
      - RATE_LIMIT_CPFS=${RATE_LIMIT_CPFS:-5/minute}
      - RATE_LIMIT_MASK=${RATE_LIMIT_MASK:-3/minute}
      - RATE_LIMIT_VARIACOES=${RATE_LIMIT_VARIACOES:-3/minute}
      - CAPTCHA_MODEL_PATH=${CAPTCHA_MODEL_PATH:-}
      - METRICS_PUBLIC=${METRICS_PUBLIC:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Proxies em que confiar para ler X-Forwarded-For. "*" vale quando o
      # container só é alcançável pelo proxy — que é o caso atrás do Coolify.
      # Se a porta ficar exposta direto, restrinja ao IP do proxy, senão dá
      # para forjar o header e furar o rate limit.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-*}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
